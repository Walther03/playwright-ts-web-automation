name: Playwright Tests - Desde Portafolio

on:
  # Aislado por completo. Solo despierta cuando presionan el botón verde en tu web
  repository_dispatch:
    types: [run-playwright-tests]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chromium Browser
      # Descarga optimizada: solo Chromium para evitar colgarse bajando Firefox y Safari
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      # Ejecución optimizada: corre únicamente tus pruebas de UI en Chrome
      run: npx playwright test --project=chromium
    - name: Upload Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
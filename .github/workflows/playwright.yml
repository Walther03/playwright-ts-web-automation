name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Aquí está el truco: usamos el contenedor oficial de Playwright con Node 24
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar dependencias del proyecto
      run: npm ci

    # Ya NO necesitas el paso de "Install Playwright Browsers" porque vienen incluidos
    - name: Ejecutar pruebas de Playwright
      run: npx playwright test

    - name: Subir Reporte de Resultados
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar dependencias del proyecto
      run: npm ci

    - name: Ejecutar pruebas de Playwright
      env:
        HOME: /root
      run: npx playwright test

    - name: Subir Reporte como Artefacto (Descargable)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # NUEVO PASO: Publicar el reporte directamente en GitHub Pages
    - name: Desplegar reporte en GitHub Pages
      uses: peaceiris/actions-gh-pages@v4 # Actualizado a v4 para evitar advertencias de Node
      if: ${{ !cancelled() }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report